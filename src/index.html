<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stake Presidency Tools</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c3f60" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <!-- TEMPORARY MAINTENANCE REDIRECT — delete this <div> and <script>
         block (only) to re-enable the app. Renders before Angular boots
         and covers the full viewport, so the app underneath never
         becomes visible or interactive while this is in place.

         Skipped on /demo/: the deploy workflow bakes this same
         index.html into both the root (production) and /demo/ builds,
         rewriting <base href> to "/demo/" for the latter (see
         .github/workflows - `ng build --base-href "/demo/"`). Checking
         that at runtime, rather than the URL path, survives deep links
         like /demo/callings/<id>. -->
    <div
      id="maintenance-overlay"
      style="
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #1c3f60;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        font-family: system-ui, sans-serif;
      "
    >
      <div>
        <h1 style="margin: 0 0 12px; font-size: 1.5rem">
          Stake Presidency Tools is temporarily unavailable
        </h1>
        <p style="margin: 0 0 8px">
          Redirecting to the interim spreadsheet in
          <span id="maintenance-countdown">15</span> seconds…
        </p>
        <p style="margin: 0">
          <a
            href="https://docs.google.com/spreadsheets/d/1TTygmYc4C-dVGWTlV6ThN7JyPexnczshQib_0iJKP2M/edit?usp=drivesdk"
            style="color: #9cc7ff"
          >
            Go there now
          </a>
        </p>
      </div>
    </div>
    <script>
      (function () {
        var baseTag = document.querySelector('base');
        var isDemo = !!baseTag && baseTag.getAttribute('href') === '/demo/';
        var overlay = document.getElementById('maintenance-overlay');
        if (isDemo) {
          if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
          return;
        }

        var seconds = 15;
        var target =
          'https://docs.google.com/spreadsheets/d/1TTygmYc4C-dVGWTlV6ThN7JyPexnczshQib_0iJKP2M/edit?usp=drivesdk';
        var countdownEl = document.getElementById('maintenance-countdown');
        var timer = setInterval(function () {
          seconds -= 1;
          if (countdownEl) countdownEl.textContent = String(seconds);
          if (seconds <= 0) {
            clearInterval(timer);
            window.location.replace(target);
          }
        }, 1000);
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
