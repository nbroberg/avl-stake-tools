# GitHub Pages deployment for the Stake Presidency Tools POC.
#
# Runs the same gates the local dev flow uses (type-check, lint, tests)
# before building, then publishes dist/avl-stake-tools/browser to Pages.
#
# GitHub Pages has no server-side URL rewriting, so client-side routes
# like /callings/<id> break on refresh unless index.html is also served
# as 404.html.
#
# Served from the custom domain in public/CNAME (lcr.avlstake.org), so
# the app lives at the domain root - base-href is "/", not "/<repo>/".
# public/CNAME must ship in every deploy artifact or GitHub Pages drops
# the custom domain on the next Actions-based deploy.
#
# The artifact carries TWO apps. The root is production, built from this
# ref against the real Firebase project. /demo/ is a second build of the
# same source with FORCE_DEMO_MODE=true and no Firebase config at all -
# mock data, a pretend signed-in user, no login. Pages only serves one
# site per repo and its one custom domain is already spent on
# lcr.avlstake.org, so a path is what a second app can have here.
#
# The demo build can come from a DIFFERENT ref than the root: run this
# workflow from the Actions tab and set demo_ref to a branch to put that
# branch's app at lcr.avlstake.org/demo/ while production stays on main.
# That is the point of the whole arrangement - review a change in a real
# browser, on a phone, before it is promoted to the root. A push to main
# rebuilds /demo/ from main, so the demo reverts to matching production
# until the next dispatch.
#
# The demo half is deliberately non-blocking: a branch that doesn't
# compile must not be able to hold production's redeploy hostage, so
# those steps continue-on-error and the assemble step simply omits /demo/
# if the build produced nothing.
#
# Firestore rules are NOT deployed by this workflow - that stays a
# deliberate manual step via `firebase deploy --only firestore:rules`,
# so a rules change requires a reviewed local command rather than
# shipping automatically alongside a frontend change. This workflow does
# still run tests/firestore.rules.test.ts against the emulator on every
# push, so a rule that accidentally widens who can read PII (people,
# callingWorkflows, priesthoodAdvancements, users) fails CI immediately,
# whether or not that change happens to get deployed in the same PR.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab for redeploys without a code change.
  workflow_dispatch:
    inputs:
      demo_ref:
        description: 'Branch, tag or SHA to build /demo/ from (blank = same ref as production)'
        required: false
        type: string
        default: ''

# One in-flight deploy per ref. Cancel superseded runs so a rapid burst
# of pushes ends with the newest commit live, not whichever finished
# first.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up Java (for the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Test Firestore rules
        run: npm run test:rules

      - name: Generate environment.ts
        # scripts/generate-environment.mjs reads process.env and writes
        # src/environments/environment.ts. It normally runs as the
        # `prebuild` npm hook, but we invoke ng build directly below
        # (so we can pass --base-href), which bypasses npm's script
        # lifecycle - so run the generator explicitly here first.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_AUTH_HD: ${{ secrets.GOOGLE_AUTH_HD }}
        run: node scripts/generate-environment.mjs

      - name: Build
        run: |
          npx ng build --configuration production --base-href "/"

      # ---- /demo/ ----------------------------------------------------
      # Checked out into its own directory so demo_ref can name a branch
      # that isn't the one being deployed to the root. Everything from
      # here to "Build demo" is continue-on-error: a work-in-progress
      # branch failing to compile should cost the demo, not production.

      - name: Check out the demo ref
        id: demo-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.demo_ref || github.sha }}
          path: demo-src

      - name: Install demo dependencies
        if: steps.demo-checkout.outcome == 'success'
        id: demo-install
        continue-on-error: true
        working-directory: demo-src
        run: npm ci

      - name: Generate demo environment.ts
        if: steps.demo-install.outcome == 'success'
        id: demo-env
        continue-on-error: true
        working-directory: demo-src
        # No Firebase secrets on purpose. Demo mode replaces every
        # Firestore-backed service, so this bundle has no use for them,
        # and an unauthenticated public path is the last place to widen
        # where project config appears. FORCE_DEMO_MODE makes the build
        # demo-only - see src/app/core/demo/demo-mode.ts.
        env:
          FORCE_DEMO_MODE: 'true'
        run: node scripts/generate-environment.mjs

      - name: Build demo
        if: steps.demo-env.outcome == 'success'
        id: demo-build
        continue-on-error: true
        working-directory: demo-src
        run: npx ng build --configuration production --base-href "/demo/"

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          out=dist/avl-stake-tools/browser
          # SPA fallback: 404.html serves index.html so deep-linked routes
          # (/callings/<id>, /scope, etc.) survive a hard refresh.
          cp "$out/index.html" "$out/404.html"
          # Tell GitHub Pages not to run its Jekyll layer over the build.
          touch "$out/.nojekyll"

          demo_out=demo-src/dist/avl-stake-tools/browser
          if [ -d "$demo_out" ]; then
            mkdir -p "$out/demo"
            cp -R "$demo_out/." "$out/demo/"
            # CNAME is a root-level Pages concern; a copy nested under
            # /demo/ does nothing but invite confusion.
            rm -f "$out/demo/CNAME"
            # Deep links into /demo/ need help: Pages serves the ROOT
            # 404.html for every unmatched path, however deep, so
            # /demo/callings would otherwise hand back production. A
            # nested /demo/404.html is never consulted - that's a Jekyll
            # behaviour and this is an artifact deploy. See the script.
            node scripts/wire-demo-deep-links.mjs "$out"
            echo "Demo built from ${{ inputs.demo_ref || github.sha }} -> /demo/"
          else
            echo "::warning::Demo build produced no output; publishing without /demo/."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/avl-stake-tools/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
